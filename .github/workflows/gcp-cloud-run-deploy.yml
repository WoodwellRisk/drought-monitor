name: Deploy Shiny Python app to Cloud Run

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
    - 'app/**'

# permissions needed for the google‑github‑actions steps
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # constants
      REGION: us-central1
      SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      ARTIFACT_REPO: ${{ secrets.ARTIFACT_REPO }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      # mask gcp service account
      - name: Mask GCP project ID and service account
        run: |
          echo "::add-mask::${{ secrets.GCP_PROJECT_ID }}"
          echo "::add-mask::${{ secrets.GCP_SERVICE_ACCOUNT }}"

      # checkout the repo (needed for docker build)
      - name: Checkout repository
        uses: actions/checkout@v7

      # authenticate to gcp via wif
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # Install the gcloud sdk
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      # authenticate docker to the artifact registry
      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev"

      # compute the image tag name, reuse later
      - name: Compute Docker image tag name
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

          # export the tag for next steps
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # create a buildx builder that supports cache backends
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # build the docker image locally, cache between runs
      - name: Build Docker image
        # run: |
        #   echo "Building image → $IMAGE_TAG"
        #   docker build app/ --tag "${IMAGE_TAG}"
        uses: docker/build-push-action@v6
        with:
          context: app/
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # authenticate docker to the artifact registry and push the image
      - name: Push Docker image to Artifact Registry
        run: docker push "${IMAGE_TAG}"

      # deploy (or update) the cloud run service
      - name: Deploy to Cloud Run
        env:
            BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          echo "Deploying ${{ env.SERVICE_NAME }} (region ${{ env.REGION }})"

          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "$IMAGE_TAG" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ env.SERVICE_ACCOUNT }}" \
            --set-env-vars BUCKET_NAME="${BUCKET_NAME}" \
            --port 8080 \
            --memory 32Gi \
            --cpu 8 \
            --concurrency 80 \
            --timeout 600s \
            --min-instances 0 \
            --max-instances 100 \
            --cpu-boost \
            --startup-probe tcpSocket.port=8080,initialDelaySeconds=0,failureThreshold=10,timeoutSeconds=10,periodSeconds=10 \
            --quiet

      # print the URL of the newly‑deployed service
      - name: Show service URL
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')
          echo "✅ Service is live at: $URL"
